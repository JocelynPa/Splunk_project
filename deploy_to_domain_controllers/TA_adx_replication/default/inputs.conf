# Run on ONE domain controller (or any domain-joined host with RSAT AD
# PowerShell) that has a Universal Forwarder. The script queries every DC.
[powershell://adx_replication_status]
script = & "$SplunkHome\etc\apps\TA_adx_replication\bin\Get-AdReplicationStatus.ps1"
schedule = 0 */10 * * * ?
sourcetype = adx:replication
index = idx_msad_win
disabled = 1
