label = License Usage Dashboard

[launcher]
author = Splunk_project
description = A self-contained Splunk app giving clients visibility into their real license consumption: an annual overview against quota, daily/monthly trends, and a breakdown of which indexes, sourcetypes, hosts and sources consume the most license. Built entirely on Splunk's own internal license_usage.log events - no external add-on or data onboarding required.
