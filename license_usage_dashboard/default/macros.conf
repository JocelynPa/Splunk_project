[license_usage_base]
definition = index=_internal source=*license_usage.log* type=Usage
iseval = 0

[license_usage_gb]
definition = eval GB=round(b/1024/1024/1024,4), idx=if(len(idx)=0 OR isnull(idx),"(UNKNOWN)",idx), h=if(len(h)=0 OR isnull(h),"(UNKNOWN)",h), s=if(len(s)=0 OR isnull(s),"(UNKNOWN)",s), st=if(len(st)=0 OR isnull(st),"(UNKNOWN)",st), pool=if(len(pool)=0 OR isnull(pool),"(UNKNOWN)",pool)
iseval = 0

[license_pool_quota_gb]
definition = | rest /services/licenser/pools splunk_server=local | eval quota_GB=round(quota/1024/1024/1024,3), used_GB=round(used_bytes/1024/1024/1024,3) | table title quota_GB used_GB
iseval = 0
