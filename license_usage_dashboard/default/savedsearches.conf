[License Usage - Daily Rollup to Summary Index]
search = `license_usage_base` earliest=-1d@d latest=@d | `license_usage_gb` | bin _time span=1d | stats sum(GB) as GB by _time, pool, idx, h, s, st | collect index=summary sourcetype=license_usage_daily_rollup
cron_schedule = 5 0 * * *
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
disabled = 1
description = Reference scheduled search that rolls up yesterday's license usage (by index/sourcetype/host/source) and persists it to a summary index via `collect`. Enable this if the client's _internal retention is shorter than the reporting window they want (e.g. they want 3 years of history but only keep 90 days of _internal) - once enough history has accumulated in the summary index, point the license_usage_base macro at it (e.g. `index=summary sourcetype=license_usage_daily_rollup`) instead of _internal. Disabled by default: out of the box, every dashboard in this app queries index=_internal directly so it works immediately with zero setup.
