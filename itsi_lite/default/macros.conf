[itsi_lite_kpi_raw]
definition = | inputlookup kpi_definitions.csv \
| eval mv_time=mvrange(0,193) \
| mvexpand mv_time \
| eval _time=relative_time(now(), "-".((192-mv_time)*15)."m") \
| sort 0 kpi_id _time \
| eval rand=(random() % 2001 - 1000) / 1000 \
| streamstats sum(rand) as walk by kpi_id \
| eval value=round(baseline + (walk * volatility), 2) \
| eval value=if(value < 0, 0, value)
iseval = 0

[itsi_lite_kpi_severity]
definition = eval severity=case(value>=threshold_critical,"critical",value>=threshold_high,"high",value>=threshold_medium,"medium",value>=threshold_low,"low",1=1,"normal"), severity_score=case(severity="critical",100,severity="high",75,severity="medium",50,severity="low",25,1=1,0), severity_color=case(severity="critical","#B0413E",severity="high","#F2854C",severity="medium","#FFC300",severity="low","#99D18B",1=1,"#65A637")
iseval = 0

[itsi_lite_service_scores_over_time]
definition = `itsi_lite_kpi_raw` | `itsi_lite_kpi_severity` \
| eventstats sum(eval(severity_score*kpi_weight)) as entity_sw sum(kpi_weight) as entity_w by entity_id _time \
| eventstats sum(eval(severity_score*kpi_weight)) as tech_sw sum(kpi_weight) as tech_w by technical_service_id _time \
| eventstats sum(eval(severity_score*kpi_weight)) as biz_sw sum(kpi_weight) as biz_w by business_service_id _time \
| eval entity_score=round(entity_sw/entity_w,1), tech_score=round(tech_sw/tech_w,1), biz_score=round(biz_sw/biz_w,1) \
| eval entity_severity=case(entity_score>=90,"critical",entity_score>=70,"high",entity_score>=45,"medium",entity_score>=20,"low",1=1,"normal") \
| eval tech_severity=case(tech_score>=90,"critical",tech_score>=70,"high",tech_score>=45,"medium",tech_score>=20,"low",1=1,"normal") \
| eval biz_severity=case(biz_score>=90,"critical",biz_score>=70,"high",biz_score>=45,"medium",biz_score>=20,"low",1=1,"normal")
iseval = 0

[itsi_lite_service_scores]
definition = `itsi_lite_service_scores_over_time` \
| stats latest(_time) as latest_time latest(value) as value latest(severity) as severity latest(severity_score) as severity_score latest(entity_score) as entity_score latest(entity_severity) as entity_severity latest(tech_score) as tech_score latest(tech_severity) as tech_severity latest(biz_score) as biz_score latest(biz_severity) as biz_severity by kpi_id kpi_name unit entity_id entity_name technical_service_id technical_service_name business_service_id business_service_name
iseval = 0

[itsi_lite_notable_events]
definition = | inputlookup kpi_definitions.csv \
| eval mv_row=mvrange(0,4) \
| mvexpand mv_row \
| eval _time=relative_time(now(), "-".(random()%4320)."m") \
| eval rand_sev=random()%100 \
| eval severity=case(rand_sev>=92,"critical",rand_sev>=75,"high",rand_sev>=50,"medium",rand_sev>=25,"low",1=1,"normal") \
| eval rand_status=random()%100 \
| eval status=case(rand_status>=70,"resolved",rand_status>=35,"in progress",1=1,"new") \
| eval rand_owner=random()%4 \
| eval owner=case(rand_owner=0,"a.martinez",rand_owner=1,"j.chen",rand_owner=2,"unassigned",1=1,"s.patel") \
| eval display_value=round(baseline*(1+((rand_sev-50)/100)),1) \
| eval description="KPI '".kpi_name."' on ".entity_name." (".technical_service_name.") crossed the ".severity." threshold - observed value ".display_value." ".unit \
| where random() % 100 < 45 \
| sort 0 -_time \
| table _time business_service_name technical_service_name entity_name kpi_name severity status owner description \
| head 40
iseval = 0
