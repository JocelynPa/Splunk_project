[ITSI Lite - KPI Base Search - Web Tier]
search = | `itsi_lite_service_scores_over_time` | search technical_service_id="svc_web_tier"
dispatch.earliest_time = -1h
cron_schedule = */5 * * * *
disabled = 1
description = Reference "KPI base search" modeled after how Splunk ITSI schedules one search per service to compute rolling KPI/health scores. Disabled by default because the dashboards in this app generate sample data on demand; enable and pair with a `collect` command if you want to persist rollup scores to a summary index instead.

[ITSI Lite - Notable Event Generator]
search = | `itsi_lite_notable_events`
dispatch.earliest_time = -1h
cron_schedule = */15 * * * *
disabled = 1
description = Reference saved search modeled after an ITSI correlation search / notable event aggregation policy. Disabled by default; the Notable Events dashboard calls the underlying macro directly on each page load, so no scheduling is required to see sample data.
