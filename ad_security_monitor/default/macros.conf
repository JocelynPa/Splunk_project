# =====================================================================
# SETTINGS YOU SHOULD REVIEW (see README "Configuration")
# =====================================================================

# Index holding Windows Security / Directory Service event logs
[adx_index]
definition = index=idx_eventlog_win
iseval = 0

# Lookups produced by the "Microsoft Windows Active Directory Objects" app.
# Used as:  | inputlookup `adx_users_lookup`
[adx_users_lookup]
definition = AD_Obj_User
iseval = 0

[adx_computers_lookup]
definition = AD_Obj_Computer
iseval = 0

[adx_groups_lookup]
definition = AD_Obj_Group
iseval = 0

# Indexes of the Microsoft Windows Active Directory Objects / Windows TA data
# used by the "AD Health & Performance" dashboard
[adx_msad_index]
definition = index=idx_msad_win
iseval = 0

[adx_perfmon_index]
definition = index=idx_perfmon_win
iseval = 0

# Keywords that flag a problem in free-text health / netlogon / DNS events
[adx_problem_terms]
definition = (fail* OR error* OR critical OR timeout OR "not respond*" OR "0xc000*" OR denied OR unreachable OR "could not")
iseval = 0

# Replication events collected by the Microsoft Windows Active Directory Objects app
# (fields: host = receiving DC, src_host = partner, naming_context, Result, LastSuccessfulSync, ...)
[adx_repl_data]
definition = `adx_msad_index` sourcetype="MSAD:NT6:Replication"
iseval = 0

# One row per replication link (dc, partner, naming_context) with its latest state.
[adx_repl_links]
definition = `adx_repl_data` \
| eval last_success_epoch=coalesce(strptime(LastSuccessfulSync,"%d/%m/%Y %H:%M:%S"), strptime(LastSuccessfulSync,"%Y-%m-%d %H:%M:%S %z")), last_attempt_epoch=coalesce(strptime(LastAttemptedSync,"%d/%m/%Y %H:%M:%S"), strptime(LastAttemptedSync,"%Y-%m-%d %H:%M:%S %z")) \
| stats latest(Result) as last_result, latest(last_success_epoch) as last_success_epoch, latest(last_attempt_epoch) as last_attempt_epoch, latest(transport) as transport, latest(_time) as seen by host src_host naming_context \
| rename host as dc, src_host as partner \
| eval lag_min=round((now()-last_success_epoch)/60,0)
iseval = 0

# Thresholds
[adx_stale_days]
definition = 90
iseval = 0

[adx_max_pwd_age_days]
definition = 90
iseval = 0

[adx_priv_max_pwd_age_days]
definition = 180
iseval = 0

[adx_auto_review_days]
definition = 90
iseval = 0

[adx_disabled_days]
definition = 180
iseval = 0

[adx_review_days]
definition = 180
iseval = 0

[adx_krbtgt_max_age_days]
definition = 180
iseval = 0

[adx_spray_threshold]
definition = 10
iseval = 0

# Off-hours = before 07:00, from 19:00, or weekend (user time zone)
[adx_offhours_filter]
definition = eval adx_h=tonumber(strftime(_time,"%H")), adx_d=tonumber(strftime(_time,"%w")) | where adx_h<7 OR adx_h>=19 OR adx_d=0 OR adx_d=6
iseval = 0

# Names of privileged groups (English + French AD). Regex alternation.
[adx_priv_group_names]
definition = Domain Admins|Enterprise Admins|Schema Admins|Administrators|Account Operators|Backup Operators|Server Operators|Print Operators|Group Policy Creator Owners|DnsAdmins|Key Admins|Enterprise Key Admins|Admins du domaine|Administrateurs de l.entreprise|Administrateurs du sch.ma|Administrateurs|Op.rateurs de compte|Op.rateurs de sauvegarde|Op.rateurs de serveur|Op.rateurs d.impression|Propri.taires cr.ateurs de la strat.gie de groupe
iseval = 0

# =====================================================================
# EVENT SOURCES
# =====================================================================
[adx_security_events]
definition = `adx_index` (source="*WinEventLog:Security" OR sourcetype="*WinEventLog:Security")
iseval = 0

[adx_ds_events]
definition = `adx_index` (source="*WinEventLog:Directory Service" OR sourcetype="*WinEventLog:Directory Service" OR source="*WinEventLog:DFS Replication" OR sourcetype="*WinEventLog:DFS Replication")
iseval = 0

# =====================================================================
# EVENT NORMALISATION
# Maps the field names produced by Splunk_TA_windows (classic and XML)
# to: event_id, target_user, actor_user, group_name, src_ip, src_host,
# logon_type, dc. Adjust the coalesce() lists here if your field names
# differ.
# =====================================================================
[adx_normalize]
definition = | eval event_id=coalesce(EventCode, EventID) \
| eval member_raw=coalesce(MemberName, Member_Name, Member_ID) \
| eval is_group_event=if(match(event_id,"^(4728|4729|4732|4733|4756|4757)"),1,0) \
| eval group_name=if(is_group_event=1, coalesce(Group_Name, TargetUserName), null()) \
| eval target_user=lower(coalesce(TargetUserName, Target_Account_Name, mvindex(Account_Name,-1), user)) \
| eval actor_user=lower(coalesce(SubjectUserName, Subject_Account_Name, src_user, mvindex(Account_Name,0))) \
| eval target_user=case(is_group_event=1, lower(replace(mvindex(member_raw,0),"^CN=([^,]+),.*","\1")), event_id="5136", lower(replace(coalesce(ObjectDN,Object_DN),"^CN=([^,]+),.*","\1")), true(), target_user) \
| eval target_user=mvindex(split(mvindex(target_user,0),"\\"),-1), actor_user=mvindex(split(mvindex(actor_user,0),"\\"),-1) \
| eval target_user=mvindex(split(target_user,"@"),0), actor_user=mvindex(split(actor_user,"@"),0) \
| eval src_ip=coalesce(IpAddress, Source_Network_Address, src_ip, src), src_host=coalesce(WorkstationName, Workstation_Name, Caller_Computer_Name, CallerComputerName, Source_Workstation), logon_type=coalesce(LogonType, Logon_Type), dc=coalesce(Computer, ComputerName, host) \
| eval src_ip=if(src_ip="-" OR src_ip="::1" OR src_ip="127.0.0.1", null(), replace(src_ip,"^::ffff:","")) \
| eval src_host=if(src_host="-", null(), src_host)
iseval = 0

# Break-glass accounts come from lookups/adx_breakglass_accounts.csv
# (several accounts supported). Terms are used as a cheap raw-text pre-filter.
[adx_breakglass_search]
definition = [| inputlookup adx_breakglass_accounts.csv | fields account | rename account as search | format]
iseval = 0

# Every event where a break-glass account is the TARGET (tgt_bg) or the ACTOR (act_bg).
[adx_breakglass_events]
definition = `adx_security_events` `adx_breakglass_search` `adx_normalize` \
| lookup adx_breakglass_accounts account AS target_user OUTPUT label AS tgt_bg \
| lookup adx_breakglass_accounts account AS actor_user OUTPUT label AS act_bg \
| search tgt_bg=* OR act_bg=* \
| lookup adx_event_catalog event_id OUTPUT action category severity \
| eval action=coalesce(action,"Événement ".event_id)
iseval = 0

# =====================================================================
# AD OBJECT LOOKUPS (Microsoft Windows Active Directory Objects app)
# =====================================================================

# Converts a lookup time field to epoch. Handles FILETIME (100ns since 1601),
# epoch ms/s, LDAP generalized time and a few text formats. "0" and
# 0x7FFF... (accountExpires "never") return null.
[adx_ts(1)]
args = f
definition = case(isnull('$f$') OR tostring('$f$')="" OR tostring('$f$')="0", null(), tonumber('$f$')>=9000000000000000000, null(), tonumber('$f$')>10000000000000000, round(tonumber('$f$')/10000000-11644473600,0), tonumber('$f$')>100000000000, round(tonumber('$f$')/1000,0), isnotnull(tonumber('$f$')), tonumber('$f$'), true(), coalesce(strptime(replace(tostring('$f$'),"(\d+)\D(\d+)\D(\d+)\D{1,3}([AP]M),\D{1,3}[A-Za-z]+\D{1,3}(\d+)/(\d+)/(\d{4}).*","\7-\5-\6 \1:\2:\3 \4"),"%Y-%m-%d %I:%M:%S %p"), strptime('$f$',"%I:%M:%S %p, %a %m/%d/%Y"), strptime('$f$',"%d/%m/%Y %H:%M:%S"), strptime('$f$',"%Y-%m-%d %H:%M:%S"), strptime('$f$',"%Y-%m-%dT%H:%M:%S%z"), strptime('$f$',"%Y-%m-%dT%H:%M:%S.%QZ"), strptime('$f$',"%Y-%m-%dT%H:%M:%SZ"), strptime('$f$',"%Y-%m-%d %H:%M:%S %z"), strptime('$f$',"%Y-%m-%d %H:%M:%S.%N"), strptime('$f$',"%d/%m/%Y %H:%M"), strptime('$f$',"%d/%m/%Y"), strptime('$f$',"%Y-%m-%d"), strptime('$f$',"%m/%d/%Y %H:%M:%S"), strptime('$f$',"%m/%d/%Y %I:%M:%S %p"), strptime('$f$',"%Y%m%d%H%M%S.0Z"), strptime('$f$',"%a %b %d %H:%M:%S %Y")))
iseval = 0

# userAccountControl flags (numeric bitmask OR text flags), timestamps, ages.
[adx_enrich]
definition = | eval uac_text=mvjoin(userAccountControl," "), uac_num=tonumber(mvindex(userAccountControl,0)) \
| eval is_disabled=if(isnotnull(uac_num), if(floor(uac_num/2)%2=1,1,0), if(match(uac_text,"(?i)ACCOUNTDISABLE"),1,0)) \
| eval pwd_never_expires=if(isnotnull(uac_num), if(floor(uac_num/65536)%2=1,1,0), if(match(uac_text,"(?i)DONT_EXPIRE"),1,0)) \
| eval pwd_not_required=if(isnotnull(uac_num), if(floor(uac_num/32)%2=1,1,0), if(match(uac_text,"(?i)PASSWD_NOTREQD"),1,0)) \
| eval no_preauth=if(isnotnull(uac_num), if(floor(uac_num/4194304)%2=1,1,0), if(match(uac_text,"(?i)DONT_REQ_PREAUTH"),1,0)) \
| eval trusted_for_delegation=if(isnotnull(uac_num), if(floor(uac_num/524288)%2=1,1,0), if(match(uac_text,"(?i)TRUSTED_FOR_DELEGATION"),1,0)) \
| eval smartcard_required=if(isnotnull(uac_num), if(floor(uac_num/262144)%2=1,1,0), if(match(uac_text,"(?i)SMARTCARD_REQUIRED"),1,0)) \
| eval is_locked=if(tonumber(coalesce(lockoutTime,0))>0,1,0) \
| eval pwd_last_set=`adx_ts(pwdLastSet)`, last_logon=`adx_ts(lastLogonTimestamp)`, acct_expires=`adx_ts(accountExpires)`, created=`adx_ts(whenCreated)` \
| eval pwd_age_days=if(isnotnull(pwd_last_set), round((now()-pwd_last_set)/86400,0), null()) \
| eval days_since_logon=if(isnotnull(last_logon), round((now()-last_logon)/86400,0), null()) \
| eval is_expired=if(isnotnull(acct_expires) AND acct_expires<now(),1,0) \
| eval must_change_pwd=if(tostring(pwdLastSet)="0",1,0) \
| eval reversible_pwd=if(isnotnull(uac_num), if(floor(uac_num/128)%2=1,1,0), if(match(uac_text,"(?i)ENCRYPTED_TEXT"),1,0)) \
| eval des_only=if(isnotnull(uac_num), if(floor(uac_num/2097152)%2=1,1,0), if(match(uac_text,"(?i)DES_KEY_ONLY"),1,0)) \
| eval pwd_days_left=if(pwd_never_expires=0 AND smartcard_required=0 AND isnotnull(pwd_age_days), `adx_max_pwd_age_days`-pwd_age_days, null()) \
| eval pwd_expired=if(isnotnull(pwd_days_left) AND pwd_days_left<0,1,0)
iseval = 0

# Privileged-group membership, derived from the group lookup (AD_Obj_User has no memberOf).
# One row per member DN with the privileged groups it belongs to (direct membership only).
[adx_priv_membership]
definition = inputlookup `adx_groups_lookup` \
| eval grp=coalesce(cn, sAMAccountName, name) \
| where match(grp,"(?i)^(`adx_priv_group_names`)(?![\w -])") \
| fields grp member \
| eval member=split(mvjoin(member,"\n"),"\n") \
| mvexpand member \
| eval dn_l=lower(replace(trim(member),",\s+",",")) \
| where len(dn_l)>0 \
| stats values(grp) as priv_groups by dn_l
iseval = 0

# Fallback: privileged membership matched on the CN of the member DN (used when DNs do not match exactly).
[adx_priv_membership_cn]
definition = inputlookup `adx_groups_lookup` \
| eval grp=coalesce(cn, sAMAccountName, name) \
| where match(grp,"(?i)^(`adx_priv_group_names`)(?![\w -])") \
| fields grp member \
| eval member=split(mvjoin(member,"\n"),"\n") \
| mvexpand member \
| eval cn_l=lower(replace(replace(trim(member),"^CN=((?:\\\\,|[^,])+),.*","\1"),"\\\\,",",")) \
| where len(cn_l)>0 AND match(trim(member),"(?i)^CN=") \
| stats values(grp) as priv_groups_cn by cn_l
iseval = 0

[adx_users]
definition = inputlookup `adx_users_lookup` \
| where isnull(isDeleted) OR NOT match(lower(isDeleted),"^(true|1)") \
| eval sam=lower(coalesce(sAMAccountName, sam_account_name, samaccountname, user)), display_name=coalesce(displayName, cn, name), dn=coalesce(distinguishedName, dn) \
| eval ou=replace(dn,"^[^,]*,",""), dn_l=lower(replace(trim(dn),",\s+",",")), cn_l=lower(coalesce(mvindex(cn,0), mvindex(name,0))), upn=userPrincipalName, location=coalesce(location, l, physicalDeliveryOfficeName) \
`adx_enrich` \
| join type=left dn_l [| `adx_priv_membership`] \
| join type=left cn_l [| `adx_priv_membership_cn`] \
| eval memberof_priv=mvfilter(match(memberOf,"(?i)^CN=(`adx_priv_group_names`),")) \
| eval memberof_names=mvmap(memberof_priv, replace(memberof_priv,"^CN=([^,]+),.*","\1")) \
| eval priv_groups=mvdedup(mvappend(priv_groups, priv_groups_cn, memberof_names)) \
| eval is_privileged=if(isnotnull(priv_groups) OR tonumber(mvindex(adminCount,0))=1,1,0)
iseval = 0

[adx_computers]
definition = inputlookup `adx_computers_lookup` \
| where isnull(isDeleted) OR NOT match(lower(isDeleted),"^(true|1)") \
| eval sam=lower(coalesce(sAMAccountName, sam_account_name, cn, name)), os=coalesce(operatingSystem, os, "unknown"), dn=coalesce(distinguishedName, dn) \
| eval ou=replace(dn,"^[^,]*,","") \
`adx_enrich`
iseval = 0

# Password-policy violations of ENABLED accounts (users only; run after `adx_users`).
# Adds a multivalue "violations" field. NB: AD does not expose password contents, so
# weak/leaked/dictionary passwords cannot be detected from these lookups.
[adx_pwd_violations]
definition = where is_disabled=0 \
| eval violations=mvappend(if(pwd_never_expires=1,"Mot de passe sans expiration",null()), if(pwd_not_required=1,"Mot de passe non requis (PASSWD_NOTREQD)",null()), if(pwd_expired=1,"Mot de passe expiré (plus ancien que la politique)",null()), if(must_change_pwd=1,"Doit changer son mot de passe à la prochaine connexion",null()), if(reversible_pwd=1,"Chiffrement réversible du mot de passe autorisé",null()), if(des_only=1,"Clés Kerberos DES uniquement",null()), if(is_privileged=1 AND pwd_age_days>`adx_priv_max_pwd_age_days`,"Mot de passe d'un compte privilégié trop ancien",null()))
iseval = 0

# =====================================================================
# DC / DNS HEALTH (MSAD:NT6:Health, MSAD:NT6:DNS-Health) - latest state per server.
# "ntfrs" is ignored in ServicesNotRunning: on DFSR-based SYSVOL (2008R2+ native) it is expected to be stopped.
# =====================================================================
[adx_dc_health]
definition = `adx_msad_index` sourcetype="MSAD:NT6:Health" \
| stats latest(_time) as seen, latest(Site) as site, latest(OperatingSystem) as os, latest(GlobalCatalog) as gc, latest(RODC) as rodc, latest(FSMORoles) as fsmo, latest(IsIntersiteTopologyGenerator) as istg, latest(SYSVOLShare) as sysvol, latest(ProcsOK) as procs_ok, latest(DNSRegister) as dns_register, latest(ServicesNotRunning) as svc_down, latest(HighestUSN) as usn, latest(ForestLevel) as forest_level, latest(DomainLevel) as domain_level, latest(SchemaVersion) as schema by Server \
| eval svc_down=trim(replace(replace(svc_down,"(?i)ntfrs",""),",+",","),",") \
| eval problem=mvappend(if(sysvol!="True","SYSVOL non partagé",null()), if(procs_ok!="True","Processus non OK",null()), if(dns_register!="True","Enregistrement DNS en échec",null()), if(len(svc_down)>0,"Services arrêtés : ".svc_down,null())) \
| eval status=if(isnotnull(problem),"PROBLÈME","OK"), minutes_ago=round((now()-seen)/60,0)
iseval = 0

[adx_dns_health]
definition = `adx_msad_index` sourcetype="MSAD:NT6:DNS-Health" \
| stats latest(_time) as seen, latest(Status) as dns_status, latest(Started) as started, latest(ProcsOK) as procs_ok, latest(ServicesNotRunning) as svc_down, latest(EnableDnsSec) as dnssec, latest(NoRecursion) as no_recursion, latest(ScavengingInterval) as scavenging_h, latest(OperatingSystem) as os, values(Forwarder) as forwarders by Server \
| eval problem=mvappend(if(dns_status!="OK","Statut DNS ".dns_status,null()), if(started!="True","Service DNS non démarré",null()), if(procs_ok!="True","Processus non OK",null()), if(len(svc_down)>0,"Services arrêtés : ".svc_down,null())) \
| eval status=if(isnotnull(problem),"PROBLÈME","OK"), minutes_ago=round((now()-seen)/60,0)
iseval = 0

# =====================================================================
# ACCOUNT REVIEW (SecOps): risk score + review reasons + review status.
# Run after `adx_users`. Points per finding are in the r_* evals; levels: ÉLEVÉ>=6, MOYEN>=3, FAIBLE>=1.
# A password changed within adx_auto_review_days automatically covers PRIVILEGED, PRIV_PWD_OLD, PWD_EXPIRED, SPN_OLD_PWD, ADMINCOUNT and DELEGATION; configuration reasons (NEVER_EXPIRES, PWD_NOT_REQUIRED, NO_PREAUTH, REVERSIBLE, DES_ONLY) and lifecycle reasons (STALE, NEVER_LOGGED, ACCT_EXPIRED, DISABLED_*) still need a manual decision.
# Review decisions are tracked per reason in lookups/adx_review_decisions.csv (sam,reason,decision,reviewer,review_date,comment); reason = a code from adx_review_reasons.csv or ALL.
# =====================================================================
[adx_risk]
definition = | eval last_change=`adx_ts(whenChanged)` \
| eval r_priv=if(is_disabled=0 AND is_privileged=1,2,0), r_never=if(is_disabled=0 AND pwd_never_expires=1,2,0), r_nreq=if(is_disabled=0 AND pwd_not_required=1,4,0), r_preauth=if(is_disabled=0 AND no_preauth=1,3,0), r_deleg=if(is_disabled=0 AND trusted_for_delegation=1,3,0), r_pwdexp=if(is_disabled=0 AND pwd_expired=1,2,0), r_privpwd=if(is_disabled=0 AND is_privileged=1 AND pwd_age_days>`adx_priv_max_pwd_age_days`,2,0), r_stale=if(is_disabled=0 AND days_since_logon>`adx_stale_days`,3,0), r_nolog=if(is_disabled=0 AND isnull(last_logon) AND created<now()-30*86400,2,0), r_acctexp=if(is_disabled=0 AND is_expired=1,3,0), r_disprv=if(is_disabled=1 AND is_privileged=1,3,0), r_disold=if(is_disabled=1 AND isnotnull(last_change) AND last_change<now()-`adx_disabled_days`*86400,1,0), r_spn=if(is_disabled=0 AND isnotnull(servicePrincipalName) AND sam!="krbtgt" AND pwd_age_days>365,3,0), r_admc=if(is_disabled=0 AND is_privileged=0 AND tonumber(mvindex(adminCount,0))=1 AND sam!="krbtgt",2,0), r_rev=if(is_disabled=0 AND reversible_pwd=1,3,0), r_des=if(is_disabled=0 AND des_only=1,2,0) \
| eval risk_score=r_priv+r_never+r_nreq+r_preauth+r_deleg+r_pwdexp+r_privpwd+r_stale+r_nolog+r_acctexp+r_disprv+r_disold+r_spn+r_admc+r_rev+r_des \
| eval review_items=mvappend(if(r_priv>0,"PRIVILEGED::Compte privilégié",null()), if(r_never>0,"NEVER_EXPIRES::Mot de passe n'expire jamais",null()), if(r_nreq>0,"PWD_NOT_REQUIRED::Mot de passe non requis",null()), if(r_preauth>0,"NO_PREAUTH::Sans pré-authentification Kerberos (AS-REP roastable)",null()), if(r_deleg>0,"DELEGATION::Délégation non contrainte",null()), if(r_pwdexp>0,"PWD_EXPIRED::Mot de passe expiré",null()), if(r_privpwd>0,"PRIV_PWD_OLD::Mot de passe privilégié trop ancien",null()), if(r_stale>0,"STALE::Aucune connexion depuis plus de la limite d'inactivité",null()), if(r_nolog>0,"NEVER_LOGGED::Jamais connecté",null()), if(r_acctexp>0,"ACCT_EXPIRED::Compte expiré mais actif",null()), if(r_disprv>0,"DISABLED_PRIV::Désactivé mais toujours privilégié",null()), if(r_disold>0,"DISABLED_OLD::Désactivé depuis longtemps (à supprimer)",null()), if(r_spn>0,"SPN_OLD_PWD::Compte de service (SPN) avec ancien mot de passe",null()), if(r_admc>0,"ADMINCOUNT::Résidu adminCount",null()), if(r_rev>0,"REVERSIBLE::Chiffrement réversible du mot de passe",null()), if(r_des>0,"DES_ONLY::Clés Kerberos DES uniquement",null())) \
| eval review_reasons=mvmap(review_items, replace(review_items,"^[A-Z_]+::","")), review_codes=mvmap(review_items, replace(review_items,"::.*","")) \
| eval risk_level=case(risk_score>=6,"ÉLEVÉ", risk_score>=3,"MOYEN", risk_score>=1,"FAIBLE", true(),"OK") \
| lookup adx_review_decisions sam OUTPUT reason AS dec_reason, decision AS dec_decision, reviewer AS dec_reviewer, review_date AS dec_date, comment AS dec_comment \
| eval dec_pair=mvzip(dec_reason, dec_date, "@") \
| eval valid_codes=mvmap(dec_pair, if(now()-strptime(replace(dec_pair,"^[^@]*@",""),"%Y-%m-%d")<=`adx_review_days`*86400, replace(dec_pair,"@.*",""), null())) \
| eval valid_str=" ".coalesce(mvjoin(valid_codes," "),"")." ", all_done=if(match(valid_str," ALL "),1,0) \
| eval auto_rot=if(isnotnull(pwd_age_days) AND pwd_age_days<=`adx_auto_review_days`,1,0) \
| eval auto_covered=mvmap(review_items, if(auto_rot=1 AND all_done=0 AND NOT match(valid_str," ".replace(review_items,"::.*","")." ") AND match(replace(review_items,"::.*",""),"^(PRIVILEGED|PRIV_PWD_OLD|PWD_EXPIRED|SPN_OLD_PWD|ADMINCOUNT|DELEGATION)(?![A-Z_])"), replace(review_items,"^[A-Z_]+::",""), null())) \
| eval remaining=mvmap(review_items, if(all_done=1 OR match(valid_str," ".replace(review_items,"::.*","")." ") OR (auto_rot=1 AND match(replace(review_items,"::.*",""),"^(PRIVILEGED|PRIV_PWD_OLD|PWD_EXPIRED|SPN_OLD_PWD|ADMINCOUNT|DELEGATION)(?![A-Z_])")), null(), replace(review_items,"^[A-Z_]+::",""))) \
| eval n_reasons=coalesce(mvcount(review_items),0), n_left=coalesce(mvcount(remaining),0), n_done=n_reasons-n_left, n_auto=coalesce(mvcount(auto_covered),0), n_manual=n_done-n_auto, review_progress=n_done."/".n_reasons \
| eval review_basis=case(n_auto>0 AND n_manual>0,"Automatique + manuelle", n_auto>0,"Automatique (mot de passe changé il y a ".pwd_age_days." j)", n_manual>0,"Manuelle", true(),"-") \
| eval review_status=case(n_reasons=0,"Conforme", n_left=0,"Revu", n_done>0,"Revue partielle", isnotnull(dec_pair),"Revue en retard", true(),"Jamais revu") \
| eval decision=mvindex(dec_decision,-1), reviewer=mvindex(dec_reviewer,-1), review_date=mvindex(dec_date,-1), comment=mvindex(dec_comment,-1) \
| fields - r_*, valid_str, dec_pair, auto_rot
iseval = 0
