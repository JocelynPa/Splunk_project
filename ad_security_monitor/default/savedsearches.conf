# All alerts are disabled by default: enable the ones you want and attach your
# own alert actions (email, ticket, webhook...). They use the break-glass
# list in lookups/adx_breakglass_accounts.csv.

[AD - Break-glass account logon]
search = `adx_breakglass_events` | search event_id=4624 tgt_bg=* | lookup adx_logon_types logon_type OUTPUT logon_type_label | table _time tgt_bg target_user logon_type_label src_ip src_host dc
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.suppress = 0
alert.track = 1
description = Fires on every successful logon of a break-glass account (secadm). Normal state: never.

[AD - Break-glass account password change or reset]
search = `adx_breakglass_events` | search (event_id=4723 OR event_id=4724 OR event_id=4794) tgt_bg=* | rename actor_user as changed_by | table _time action target_user changed_by src_host dc
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.suppress = 0
alert.track = 1
description = Fires when the password of a break-glass account is changed or reset (4723/4724/4794).

[AD - Break-glass account modified]
search = `adx_breakglass_events` | search tgt_bg=* (event_id=4738 OR event_id=4722 OR event_id=4725 OR event_id=4726 OR event_id=4781 OR event_id=4767 OR event_id=4740 OR event_id=5136 OR is_group_event=1) | rename actor_user as changed_by | table _time action target_user group_name changed_by src_host dc
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 0
alert.track = 1
description = Fires on any modification of a break-glass account: attributes, enable/disable, rename, lockout/unlock, group membership.

[AD - Break-glass account performed actions]
search = `adx_breakglass_events` | search act_bg=* (category="Account Management" OR category="Group Management") | table _time action actor_user target_user group_name src_host dc
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 0
alert.track = 1
description = Fires when a break-glass account is used to change other accounts or groups.

[AD - Privileged group membership change]
search = `adx_security_events` `adx_normalize` | search is_group_event=1 | where match(group_name,"(?i)^(`adx_priv_group_names`)(?![\w -])") | lookup adx_event_catalog event_id OUTPUT action | rename actor_user as changed_by, target_user as member | table _time action group_name member changed_by dc
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 0
alert.track = 1
description = Fires when a member is added to or removed from a privileged group (Domain Admins, Enterprise Admins, Administrators...).

[AD - Security audit log cleared]
search = `adx_security_events` EventCode IN (1102,4719) | table _time EventCode host
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.suppress = 0
alert.track = 1
description = Fires when the Security log is cleared (1102) or the audit policy is changed (4719).

[AD - Replication link failing]
search = `adx_repl_data` | stats latest(consecutive_failures) as consecutive_failures, latest(last_result_text) as last_result_text by source_dc partner partition | where consecutive_failures>0
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.suppress = 0
alert.track = 1
description = Fires when an AD replication link reports consecutive failures (scripted input from TA_adx_replication).

[AD - KPI Snapshot to Summary Index]
search = `adx_users` | eval never_expire_enabled=if(is_disabled=0 AND pwd_never_expires=1,1,0), stale_enabled=if(is_disabled=0 AND days_since_logon>`adx_stale_days`,1,0), enabled=1-is_disabled | stats count as total, sum(enabled) as enabled, sum(is_disabled) as disabled, sum(never_expire_enabled) as never_expire_enabled, sum(stale_enabled) as stale_enabled, sum(is_locked) as locked, sum(is_privileged) as privileged | collect index=summary sourcetype=adx_kpi_snapshot
cron_schedule = 15 6 * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
disabled = 1
description = Daily snapshot of the AD account KPIs (total, enabled, disabled, never-expire, stale, locked, privileged) into the summary index, to feed the trend panel of the AD Accounts Overview dashboard. Disabled by default.
