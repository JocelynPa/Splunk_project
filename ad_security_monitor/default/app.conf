[install]
is_configured = 0
state = enabled

[ui]
is_visible = 1
label = AD Security & Break-Glass Monitor

[launcher]
author = Splunk_project
description = Centralised Active Directory security monitoring: a dedicated view of the "secadm" break-glass account (password changes, usage, who/where/when, group and attribute changes), an AD account-hygiene overview built on the lookups of the Microsoft Windows Active Directory Objects app (enabled/disabled, password never expires, stale, expired, privileged), AD replication health, and account-activity / attack-technique detections (password spray, Kerberoasting, DCSync, privileged group changes, audit log cleared).
version = 1.0.0

[package]
id = ad_security_monitor
