# Per-index thresholds. WILDCARD match: the FIRST matching row of the CSV wins,
# so keep specific indexes above generic patterns, and "*" last.
[idxmon_thresholds]
filename = idxmon_thresholds.csv
match_type = WILDCARD(index)
max_matches = 1
case_sensitive_match = false

# Per-(index, sourcetype) thresholds. Opt-in: only combinations listed here are
# monitored at sourcetype level. First matching row wins (file order).
[idxmon_st_thresholds]
filename = idxmon_st_thresholds.csv
match_type = WILDCARD(index), WILDCARD(sourcetype)
max_matches = 1
case_sensitive_match = false
