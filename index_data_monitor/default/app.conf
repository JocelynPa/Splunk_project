[install]
is_configured = 0
state = enabled

[ui]
is_visible = 1
label = Index Data Monitor

[launcher]
author = Splunk_project
description = Proactive monitoring and alerting on indexed data: detects indexes that have stopped receiving data for longer than a per-index threshold (editable lookup), raises a throttled alert per silent index, keeps a status history in a summary index, and provides a dashboard to see which indexes, sourcetypes and hosts went silent and since when.
version = 1.0.0

[package]
id = index_data_monitor
