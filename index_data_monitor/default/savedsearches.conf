[IDX Monitor - Alert - Index not receiving data]
search = `idxmon_status` | where status="STALE" | table index severity silent_for last_indexed_str threshold_minutes owner comment
description = Fires once per index that has received no data for longer than its threshold (see lookup idxmon_thresholds). Throttled per index (4h) so a long outage does not flood the mailbox. Add actions (email, Slack/webhook, ITSM) in the alert settings.
enableSched = 1
cron_schedule = */15 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
# One alert per silent index, throttled per index
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = index
alert.suppress.period = 4h
alert.severity = 4
alert.track = 1
# Uncomment and adapt to be notified by email (requires an SMTP server in Settings > Server settings > Email settings):
# action.email = 1
# action.email.to = splunk-admins@example.com
# action.email.subject = [Splunk][$result.severity$] Index $result.index$ is not receiving data
# action.email.message.alert = Index $result.index$ has not received data for $result.silent_for$ (threshold: $result.threshold_minutes$ min). Last indexed event: $result.last_indexed_str$. Owner: $result.owner$
# action.email.inline = 1
# action.email.sendresults = 1
disabled = 0

[IDX Monitor - Status Snapshot to Summary Index]
search = `idxmon_status` | where status!="Ignored" | eval _time=now() | table _time index status minutes_since threshold_minutes severity total_events | collect index=summary sourcetype=idxmon_status source=idxmon_snapshot
description = Every 15 minutes, stores the freshness status of every monitored index in the summary index. Feeds the history charts of the dashboards.
enableSched = 1
cron_schedule = */15 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
disabled = 0

[IDX Monitor - Alert - Index recovered]
search = index=summary sourcetype=idxmon_status | sort 0 index _time | streamstats current=f window=1 last(status) as prev_status by index | where prev_status="STALE" AND (status="OK" OR status="Warning") AND _time>=relative_time(now(),"-20m") | eval recovered_at=strftime(_time,"%Y-%m-%d %H:%M:%S"), silent_for=tostring(minutes_since*60,"duration") | table index severity recovered_at status silent_for threshold_minutes
description = Fires once per index when it goes back from STALE to OK/Warning, detected from two consecutive status snapshots (needs the "Status Snapshot to Summary Index" search enabled). Throttled 1h per index to avoid duplicates since the look-back window (20 min) is wider than the schedule (15 min).
enableSched = 1
cron_schedule = 2-59/15 * * * *
dispatch.earliest_time = -2h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = index
alert.suppress.period = 1h
alert.severity = 2
alert.track = 1
# Same email options as the "not receiving data" alert, for example:
# action.email = 1
# action.email.to = splunk-admins@example.com
# action.email.subject = [Splunk] Index $result.index$ is receiving data again
# action.email.message.alert = Index $result.index$ recovered at $result.recovered_at$ (status: $result.status$).
disabled = 0
