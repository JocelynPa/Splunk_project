# How far back to look for the last indexed event. An index with no event in
# this window is considered silent (STALE) unless it never received any data.
[idxmon_lookback]
definition = -30d@d
iseval = 0

# Used when the lookup has no matching row at all (the "*" row normally covers this).
[idxmon_default_threshold]
definition = 60
iseval = 0

# Share of the threshold at which an index turns "Warning" (early heads-up).
[idxmon_warning_ratio]
definition = 0.75
iseval = 0

# One row per index with its freshness status. Call it as: | `idxmon_status`
#  (the macro body starts with tstats, so the caller supplies the leading pipe;
#  otherwise Splunk prepends "search" and tstats is no longer the first command)
#  last_indexed = most recent INDEX time (not event time), so late/backdated
#  events do not hide a stalled pipeline and future timestamps do not fool it.
[idxmon_status]
definition = tstats max(_indextime) as last_indexed count as events_lookback where (index=* OR index=_*) earliest=`idxmon_lookback` by index \
| append [| rest splunk_server=* count=0 /services/data/indexes | search disabled=0 datatype=event | stats sum(totalEventCount) as total_events by title | rename title as index] \
| stats max(last_indexed) as last_indexed max(events_lookback) as events_lookback max(total_events) as total_events by index \
| lookup idxmon_thresholds index OUTPUT threshold_minutes enabled severity owner comment \
| eval threshold_minutes=coalesce(tonumber(threshold_minutes), `idxmon_default_threshold`), enabled=coalesce(tonumber(enabled),1), severity=if(len(severity)>0,severity,"medium"), total_events=coalesce(total_events,0) \
| eval minutes_since=if(isnotnull(last_indexed), round((now()-last_indexed)/60,0), null()) \
| eval status=case(enabled=0,"Ignored", isnull(last_indexed) AND total_events=0,"Empty", isnull(last_indexed),"STALE", minutes_since>threshold_minutes,"STALE", minutes_since>=threshold_minutes*`idxmon_warning_ratio`,"Warning", true(),"OK") \
| eval last_indexed_str=if(isnotnull(last_indexed), strftime(last_indexed,"%Y-%m-%d %H:%M:%S"), "no data in lookback"), silent_for=if(isnotnull(minutes_since), tostring(minutes_since*60,"duration"), "n/a") \
| eval sort_order=case(status="STALE",1,status="Warning",2,status="OK",3,status="Empty",4,true(),5)

# Sourcetype/host breakdown of one index (dashboard drilldown).
[idxmon_detail(1)]
args = idx
definition = tstats max(_indextime) as last_indexed count where index="$idx$" earliest=`idxmon_lookback` by sourcetype host \
| eval minutes_since=round((now()-last_indexed)/60,0), last_indexed=strftime(last_indexed,"%Y-%m-%d %H:%M:%S"), silent_for=tostring(minutes_since*60,"duration") \
| sort - minutes_since
iseval = 0

# Freshness per (index, sourcetype), only for combinations that have a rule in
# idxmon_st_thresholds. Call it as: | `idxmon_status_st`
#  - Rules with an exact index AND sourcetype (no wildcard) are also listed when the
#    combination sent nothing during the lookback, so a sourcetype that disappeared
#    completely is detected (status STALE, "no data in lookback").
#  - Rules with wildcards only apply to combinations that exist in the lookback.
[idxmon_status_st]
definition = tstats max(_indextime) as last_indexed count as events_lookback where (index=* OR index=_*) earliest=`idxmon_lookback` by index sourcetype \
| append [| inputlookup idxmon_st_thresholds | where NOT like(index,"%*%") AND NOT like(sourcetype,"%*%") | fields index sourcetype] \
| stats max(last_indexed) as last_indexed max(events_lookback) as events_lookback by index sourcetype \
| lookup idxmon_st_thresholds index sourcetype OUTPUT threshold_minutes enabled severity owner comment \
| where isnotnull(threshold_minutes) \
| eval threshold_minutes=tonumber(threshold_minutes), enabled=coalesce(tonumber(enabled),1), severity=if(len(severity)>0,severity,"medium"), events_lookback=coalesce(events_lookback,0) \
| eval minutes_since=if(isnotnull(last_indexed), round((now()-last_indexed)/60,0), null()) \
| eval status=case(enabled=0,"Ignored", isnull(last_indexed),"STALE", minutes_since>threshold_minutes,"STALE", minutes_since>=threshold_minutes*`idxmon_warning_ratio`,"Warning", true(),"OK") \
| eval last_indexed_str=if(isnotnull(last_indexed), strftime(last_indexed,"%Y-%m-%d %H:%M:%S"), "no data in lookback"), silent_for=if(isnotnull(minutes_since), tostring(minutes_since*60,"duration"), "n/a") \
| eval sort_order=case(status="STALE",1,status="Warning",2,status="OK",3,true(),5)
iseval = 0
