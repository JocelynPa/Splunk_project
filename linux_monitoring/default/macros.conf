# =====================================================================
# SETTINGS YOU SHOULD REVIEW
# =====================================================================

# Index receiving the Splunk_TA_nix data (set in inputs.conf: index = ...)
[nix_idx]
definition = index=os
iseval = 0

# Silence threshold in minutes for the "silent host" detection
[nix_silent_minutes]
definition = 15
iseval = 0

# =====================================================================
# SHARED SEARCH FRAGMENTS
# =====================================================================

# Latest usage % per real filesystem (df sourcetype). Pseudo filesystems excluded.
[nix_df_pct]
definition = `nix_idx` sourcetype=df earliest=-4h | eval pct=tonumber(replace(UsePct,"%","")), mount=MountedOn | where isnotnull(pct) AND NOT match(Type,"tmpfs|devtmpfs|squashfs|overlay|iso9660") | stats latest(pct) as pct latest(Size) as Size latest(Avail) as Avail latest(Type) as Type latest(Filesystem) as filesystem by host mount
iseval = 0

# Hosts that sent vmstat/cpu data in the last 24h but nothing for nix_silent_minutes
[nix_silent_hosts]
definition = `nix_idx` earliest=-24h sourcetype IN (vmstat,cpu,df) | stats latest(_time) as last by host | eval age_min=round((now()-last)/60,0) | where age_min>`nix_silent_minutes` | eval last_seen=strftime(last,"%F %T") | fields host last_seen age_min
iseval = 0

# 1-minute load vs. number of cores (needs the hardware sourcetype for cpu_cores)
[nix_load_vs_cores]
definition = `nix_idx` sourcetype=vmstat earliest=-1h | stats latest(loadAvg1mi) as load1 by host | join type=left host [search `nix_idx` sourcetype=hardware earliest=-7d | stats latest(cpu_cores) as cores by host] | eval cores=coalesce(tonumber(cores),1)
iseval = 0

# Normalised investigation events (linux_secure, syslog, auditd, bash_history).
# Adds src, user, event_type, detail and the sudo fields used by the Investigation dashboard.
[nix_inv]
definition = `nix_idx` sourcetype IN (linux_secure,syslog,linux_audit,auditd,bash_history) | rex field=_raw "sudo:\s+(?<sudo_user>\S+)\s+:.*?PWD=(?<sudo_pwd>\S+)\s+;\s+USER=(?<sudo_target>\S+)\s+;\s+COMMAND=(?<sudo_cmd>.*)$" | eval src=coalesce(src,src_ip), user=coalesce(sudo_user,user,user_name,acct,src_user,"unknown"), event_type=case(sourcetype=="bash_history","Shell command", isnotnull(sudo_cmd),"sudo command", match(_raw,"Accepted (password|publickey|keyboard-interactive)"),"SSH login success", match(_raw,"(?i)Failed password|Invalid user|authentication failure|BAD SU|FAILED SU|could not identify password"),"Authentication failure", command IN ("useradd","userdel","groupadd","groupdel","passwd","usermod") OR match(type,"ADD_USER|DEL_USER|USER_MGMT|ADD_GROUP|DEL_GROUP|GRP_MGMT"),"Account change", match(_raw,"(?i)session opened for user root|Successful su|su: \(to"),"Privilege session", match(_raw,"(?i)session closed|Disconnected from|Connection closed"),"Session end", sourcetype IN ("linux_audit","auditd"),"Audit: ".coalesce(type,"event"), true(),"Other"), detail=case(isnotnull(sudo_cmd),sudo_cmd, sourcetype=="bash_history",_raw, sourcetype IN ("linux_audit","auditd"),coalesce(proctitle,execve_command,exe,substr(_raw,1,200)), true(),substr(_raw,1,200))
iseval = 0
