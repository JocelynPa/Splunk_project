[Infra & Security Audit - Daily Findings Snapshot to Summary Index]
search = [ `audit_queue_fill` earliest=-15m | stats max(pct_full) as MaxPct | eval Category="Infrastructure", Check="Indexing queues not blocked", Status=case(MaxPct>=100,"CRITICAL",MaxPct>=90,"WARNING",true(),"OK"), Detail="Max queue fill: ".round(MaxPct,1)."%" | table Category Check Status Detail ] | append [ `audit_errors_warnings` log_level=ERROR earliest=-24h | stats count | eval Category="Infrastructure", Check="Low ERROR rate in splunkd.log (24h)", Status=case(count>=100,"CRITICAL",count>=20,"WARNING",true(),"OK"), Detail=count." ERROR events in the last 24h" | table Category Check Status Detail ] | append [ `audit_scheduler_log` status=skipped earliest=-24h | stats count | eval Category="Infrastructure", Check="Scheduled searches not being skipped (24h)", Status=case(count>=50,"CRITICAL",count>=10,"WARNING",true(),"OK"), Detail=count." skipped search executions in the last 24h" | table Category Check Status Detail ] | append [ `audit_rest_indexes` | eval PctUsed=if(maxTotalDataSizeMB>0,round((currentDBSizeMB/maxTotalDataSizeMB)*100,1),0) | where PctUsed>=80 | stats count as NearMax, max(PctUsed) as MaxPct | eval Category="Infrastructure", Check="Indexes within size quota", Status=case(MaxPct>=95,"CRITICAL",NearMax>0,"WARNING",true(),"OK"), Detail=NearMax." index(es) at/above 80% of max size" | table Category Check Status Detail ] | append [ `audit_rest_partitions_space` | stats min(free) as MinFreeMB | appendcols [ `audit_rest_server_settings` | stats max(minFreeSpace) as MinFreeThresholdMB ] | eval Category="Infrastructure", Check="Disk space above minFreeSpace threshold", Status=case(MinFreeMB<MinFreeThresholdMB,"CRITICAL",MinFreeMB<(MinFreeThresholdMB*2),"WARNING",true(),"OK"), Detail="Lowest free space: ".round(MinFreeMB/1024,1)."GB (threshold: ".round(MinFreeThresholdMB/1024,1)."GB)" | table Category Check Status Detail ] | append [ `audit_rest_license_pools` | eval PctUsed=if(quota>0,round((used_bytes/quota)*100,1),0) | stats max(PctUsed) as MaxPct | eval Category="Infrastructure", Check="License usage within quota", Status=case(MaxPct>=100,"CRITICAL",MaxPct>=90,"WARNING",true(),"OK"), Detail="Highest pool usage: ".MaxPct."%" | table Category Check Status Detail ] | append [ `audit_rest_kvstore_status` | stats values(status) as status | eval Category="Infrastructure", Check="KV store healthy", Status=if(status="ready","OK","WARNING"), Detail="KV store status: ".status | table Category Check Status Detail ] | append [ `audit_rest_server_settings` | eval enabled=if(match('enableSplunkWebSSL',"(?i)^(1|true)$"),1,0) | stats max(enabled) as enabled | eval Category="Security", Check="Splunk Web SSL enabled", Status=if(enabled=1,"OK","WARNING"), Detail=if(enabled=1,"Splunk Web is serving over HTTPS","Splunk Web is serving over plain HTTP") | table Category Check Status Detail ] | append [ `audit_rest_sslconfig` | eval enabled=if(match('enableSplunkdSSL',"(?i)^(0|false)$"),0,1) | stats max(enabled) as enabled | eval Category="Security", Check="Management port (8089) SSL enabled", Status=if(enabled=1,"OK","WARNING"), Detail=if(enabled=1,"splunkd management traffic is encrypted","enableSplunkdSSL is disabled") | table Category Check Status Detail ] | append [ `audit_rest_users` | search "locked-out"=1 | stats count | eval Category="Security", Check="No locked-out accounts", Status=if(count>0,"WARNING","OK"), Detail=count." account(s) currently locked out" | table Category Check Status Detail ] | append [ `audit_login_events` info=failed earliest=-24h | stats count | eval Category="Security", Check="Failed login attempts within normal range (24h)", Status=case(count>=100,"CRITICAL",count>=20,"WARNING",true(),"OK"), Detail=count." failed login attempts in the last 24h" | table Category Check Status Detail ] | append [ `audit_rest_saved_searches_acl` | search "eai:acl.sharing"="global" "eai:acl.perms.write"="*" | stats count | eval Category="Security", Check="No globally shared saved searches writable by everyone", Status=if(count>0,"WARNING","OK"), Detail=count." saved search(es) shared globally with write access for everyone" | table Category Check Status Detail ] | append [ `audit_rest_users` | search roles=admin | stats count | eval Category="Security", Check="Number of users holding the admin role kept minimal", Status=if(count>10,"WARNING","OK"), Detail=count." user(s) hold the admin role" | table Category Check Status Detail ] | append [ | rest /services/authentication/providers/LDAP splunk_server=local | eval encrypted=if(match(SSL,"(?i)^(1|true)$"),1,0) | stats count as total, sum(encrypted) as encrypted_count | eval Category="Security", Check="LDAP strategies use SSL/TLS (LDAPS)", Status=case(total=0,"OK",encrypted_count<total,"WARNING",true(),"OK"), Detail=if(total=0,"No LDAP strategy configured",(total-encrypted_count)." of ".total." LDAP strategy(ies) not using SSL/TLS") | table Category Check Status Detail ] | eval snapshot_date=strftime(now(),"%Y-%m-%d") | collect index=summary sourcetype=infra_security_audit_findings
cron_schedule = 0 6 * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
disabled = 1
description = Reference scheduled search that snapshots the Audit Summary dashboard's findings checklist into a summary index via `collect`, once a day. Enable this to track findings history over time (e.g. "how many days has SSL been disabled", "when did skipped searches start trending up") instead of only ever seeing the current state. Disabled by default: out of the box, the Audit Summary dashboard always computes the findings checklist live.
