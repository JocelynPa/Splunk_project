[install]
is_configured = 0
state = enabled

[ui]
is_visible = 1
label = Infrastructure & Security Audit

[launcher]
author = Splunk_project
description = A self-contained Splunk app that audits the health of a Splunk deployment (indexing pipeline, queues, disk usage, errors, scheduler, forwarders, KV store, licensing) and its security posture (authentication activity, users/roles, TLS configuration, privileged configuration changes, knowledge-object sharing, sensitive REST API access). Built entirely on Splunk's own internal indexes and REST endpoints - no add-on or external data onboarding required.
version = 1.0.0

[package]
id = infra_security_audit
